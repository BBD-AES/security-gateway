server:
  port: 8080

  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        same-site: lax
        path: /

spring:
  application:
    name: security-gateway

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_ENDPOINT}
    username: ${DB_NAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - bbd-claims

        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://bbd-user:8080
          predicates:
            - Path=/api/v1/users/**,/api/v2/users/**

        - id: item-service
          uri: http://bbd-item:8080
          predicates:
            - Path=/api/v1/items/**,/api/v2/items/**
          filters:
            - PrefixPath=/item

        - id: inventory-service
          uri: http://bbd-inventory:8080
          predicates:
            - Path=/api/v1/inventory/**,/api/v2/inventory/**

        - id: procurement-service
          uri: http://bbd-procurement:8080
          predicates:
            - Path=/api/v1/procurements/**,/api/v2/procurements/**

        - id: sales-service
          uri: http://bbd-sales:8080
          predicates:
            - Path=/api/v1/sales/**,/api/v2/sales/**

      httpclient:
        connect-timeout: 3000
        response-timeout: 5s

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG