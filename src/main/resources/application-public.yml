server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
        path: /

# 프론트엔드 origin/URL — CORS 허용 origin + OIDC 로그인/로그아웃/만료 리다이렉트에 사용.
# 동일출처(nginx 프록시) 배포면 공개 도메인으로, 다른 origin이면 그 origin으로 env 주입.
app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: security-gateway

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:bbd-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:security-gateway}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - bbd-claims

        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URI:http://bbd-user:8080}
              predicates:
                - Path=/user/**
              filters:
                - TokenRelay=

            - id: item-service
              uri: ${ITEM_SERVICE_URI:http://bbd-item:8080}
              predicates:
                - Path=/item/**
              filters:
                - TokenRelay=

            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URI:http://bbd-inventory:8080}
              predicates:
                - Path=/inventory/**
              filters:
                - TokenRelay=

            - id: procurement-service
              uri: ${PROCUREMENT_SERVICE_URI:http://bbd-procurement:8080}
              predicates:
                - Path=/procurement/**
              filters:
                - TokenRelay=

            - id: sales-service
              uri: ${SALES_SERVICE_URI:http://bbd-sales:8080}
              predicates:
                - Path=/sales/**
              filters:
                - TokenRelay=


    httpclient:
      connect-timeout: 3000
      response-timeout: 5s

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}