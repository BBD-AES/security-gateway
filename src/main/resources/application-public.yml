server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
        path: /

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: security-gateway

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:bbd-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:security-gateway}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - bbd-claims

        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URI}
              predicates:
                - Path=/user/api/v1/users/**,/user/api/v2/users/**
              filters:
                - TokenRelay=

            - id: user-service-swagger
              uri: ${USER_SERVICE_URI}
              predicates:
                - Path=/user/swagger-ui/**,/user/swagger-ui.html,/user/v3/api-docs/**

            - id: item-service
              uri: ${ITEM_SERVICE_URI}
              predicates:
                - Path=/item/api/v1/items/**,/item/api/v2/items/**
              filters:
                - TokenRelay=

            - id: item-service-swagger
              uri: ${ITEM_SERVICE_URI}
              predicates:
                - Path=/item/swagger-ui/**,/item/swagger-ui.html,/item/v3/api-docs/**

            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URI}
              predicates:
                - Path=/inventory/api/v1/inventory/**,/inventory/api/v2/inventory/**
              filters:
                - TokenRelay=

            - id: inventory-service-swagger
              uri: ${INVENTORY_SERVICE_URI}
              predicates:
                - Path=/inventory/swagger-ui/**,/inventory/swagger-ui.html,/inventory/v3/api-docs/**

            - id: procurement-service
              uri: ${PROCUREMENT_SERVICE_URI}
              predicates:
                - Path=/procurement/api/v1/procurements/**,/procurement/api/v2/procurements/**
              filters:
                - TokenRelay=

            - id: procurement-service-swagger
              uri: ${PROCUREMENT_SERVICE_URI}
              predicates:
                - Path=/procurement/swagger-ui/**,/procurement/swagger-ui.html,/procurement/v3/api-docs/**

            - id: sales-service
              uri: ${SALES_SERVICE_URI}
              predicates:
                - Path=/sales/api/v1/sales/**,/sales/api/v2/sales/**
              filters:
                - TokenRelay=

            - id: sales-service-swagger
              uri: ${SALES_SERVICE_URI}
              predicates:
                - Path=/sales/swagger-ui/**,/sales/swagger-ui.html,/sales/v3/api-docs/**

    httpclient:
      connect-timeout: 3000
      response-timeout: 5s

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}