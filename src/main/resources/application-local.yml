server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: false # https 환경에서는 true로 변경
        same-site: lax
        path: /

spring:
  application:
    name: security-gateway

  data:
    redis:
      host: localhost
      port: 6379
      # password: your-redis-password

  # 시원
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: security-gateway
            ## 환경변수 바꾸기
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - bbd-claims

        provider:
          keycloak:
            issuer-uri: https://bbd-keycloak.inwoohub.com/auth/realms/bbd
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: https://bbd-keycloak.inwoohub.com/auth/realms/bbd

  # 인우
  cloud:
    gateway:
      routes:
        - id: item-service
          uri: http://localhost:8082
          predicates:
            - Path=/item/**

          filters:
            - StripPrefix=1

      httpclient:
        connect-timeout: 3000
        response-timeout: 5s

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG

