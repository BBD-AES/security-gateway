server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
        path: /

security-gateway:
  frontend:
    base-url: ${FRONTEND_BASE_URL}
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:${FRONTEND_BASE_URL}}
    login-path: ${FRONTEND_LOGIN_PATH:/login}
    main-path: ${FRONTEND_MAIN_PATH:/main}

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: security-gateway

  threads:
    virtual:
      enabled: true

  session:
    timeout: ${SESSION_TIMEOUT:30m}
    data:
      redis:
        repository-type: indexed
        namespace: ${REDIS_SESSION_NAMESPACE:security-gateway:session}
        flush-mode: ${REDIS_SESSION_FLUSH_MODE:on-save}
        save-mode: ${REDIS_SESSION_SAVE_MODE:on-set-attribute}

  data:
    redis:
      host: ${REDIS_HOST:bbd-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:security-gateway}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - bbd-claims

        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URI:http://bbd-user:8080}
              predicates:
                - Path=/user/**
              filters:
                - TokenRelay=

            - id: item-service
              uri: ${ITEM_SERVICE_URI:http://bbd-item:8080}
              predicates:
                - Path=/item/**
              filters:
                - TokenRelay=

            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URI:http://bbd-inventory:8080}
              predicates:
                - Path=/inventory/**
              filters:
                - TokenRelay=

            - id: procurement-service
              uri: ${PROCUREMENT_SERVICE_URI:http://bbd-procurement:8080}
              predicates:
                - Path=/procurement/**
              filters:
                - TokenRelay=

            - id: sales-service
              uri: ${SALES_SERVICE_URI:http://bbd-sales:8080}
              predicates:
                - Path=/sales/**
              filters:
                - TokenRelay=

    httpclient:
      connect-timeout: 3000
      response-timeout: 5s

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:DEBUG}
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:DEBUG}
